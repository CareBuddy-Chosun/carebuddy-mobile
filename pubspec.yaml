name: carebuddy
description: "CareBuddy — Voice-First AI Healthcare Triage Assistant"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0
  # retrofit removed — using manual Dio repositories instead

  # Local storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3

  # Voice
  record: ^5.2.0
  audioplayers: ^6.1.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  # 웹 TTS는 flutter_tts_web의 onBoundary JS-interop 캐스팅 버그를 피하려
  # Web Speech API를 직접 호출한다(lib/core/services/tts_web.dart).
  web: ^1.1.0

  # Maps & Location
  geolocator: ^13.0.2
  google_maps_flutter: ^2.10.0

  # UI
  lottie: ^3.3.1
  cached_network_image: ^3.4.1

  # Platform
  url_launcher: ^6.2.0
  path_provider: ^2.1.0

  # Utilities
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  intl: ^0.20.2

dependency_overrides:
  record_linux: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  # retrofit_generator removed — not needed

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
